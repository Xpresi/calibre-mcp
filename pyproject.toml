[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calibre-mcp"
version = "0.3.0"
description = "MCP server for managing a Calibre ebook library — duplicates, normalization, series, metadata"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["calibre", "ebooks", "mcp", "library", "metadata"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "mcp[cli]>=1.0.0,<2",  # 2.x renamed Tool.inputSchema → input_schema
    "send2trash>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/Xpresi/calibre-mcp"
Issues = "https://github.com/Xpresi/calibre-mcp/issues"

[project.scripts]
calibre-mcp = "calibre_mcp.server:main"
